services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tecnocar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tecnocar}
      POSTGRES_DB: ${DB_NAME:-tecnocar}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
